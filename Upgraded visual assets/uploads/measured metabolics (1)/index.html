<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Measured — Precision Metabolic Medicine, Australia</title>
<meta name="description" content="Pathology-validated testing, CGM-guided GLP-1 therapy, and a doctor who turns your data into a plan built around your life. Clinician-led metabolic care, Australia-wide." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: "var(--ink)", ink2: "var(--ink-2)", muted: "var(--muted)",
          line: "var(--line)", line2: "var(--line-2)",
          lav: "var(--lav)", lav2: "var(--lav-2)", lavsoft: "var(--lav-soft)", lavtint: "var(--lav-tint)",
          blue: "var(--blue)", bgsoft: "var(--bg-soft)", bgsoft2: "var(--bg-soft2)",
        },
        fontFamily: {
          disp: ['"Hanken Grotesk"', "system-ui", "sans-serif"],
          sans: ['"Inter"', "system-ui", "sans-serif"],
        },
        boxShadow: {
          card: "0 2px 4px rgba(20,18,40,.04), 0 18px 40px -22px rgba(40,32,90,.22)",
          soft: "0 1px 2px rgba(20,18,40,.04), 0 8px 24px -14px rgba(40,32,90,.18)",
        },
        borderRadius: { xl2: "22px" },
      },
    },
  };
</script>
<style>
  :root{
    --bg:#ffffff; --bg-soft:#f7f6fc; --bg-soft2:#f1f0f8;
    --ink:#0e0e14; --ink-2:#46464f; --muted:#8d8d99;
    --line:#eceaf3; --line-2:#e2e0ec;
    --lav:#2f7d54; --lav-2:#4ea173; --lav-soft:#e7f3ec; --lav-tint:#f1f8f3;
    --blue:#1f7a5e;
    --gold:#b8923f;
    --grad-dot:linear-gradient(135deg,#7fc79a,#cfe8b8);
    --grad-blue:linear-gradient(150deg,#123b2a 0%,#1f7a5e 55%,#69c79a 100%);
    --grad-lav:linear-gradient(135deg,#2f7d54,#57b07f);
  }
  [data-accent="ochre"]{--lav:#c08a2e;--lav-2:#d6a850;--lav-soft:#f8efdc;--lav-tint:#fdf8ee;--grad-lav:linear-gradient(135deg,#c08a2e,#dcae5c);--grad-dot:linear-gradient(135deg,#ecd29a,#f3e3bd);}
  [data-accent="teal"]{--lav:#1f8a82;--lav-2:#4aa9a1;--lav-soft:#e2f3f1;--lav-tint:#eef7f6;--grad-lav:linear-gradient(135deg,#1f8a82,#46b0a6);--grad-dot:linear-gradient(135deg,#94d8d0,#bfeae3);}
  html{scroll-behavior:smooth;}
  body{font-family:"Inter",system-ui,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  ::selection{background:var(--lav);color:#fff;}
  .font-disp{font-family:"Hanken Grotesk",system-ui,sans-serif;}
  .grad-dot{background:var(--grad-dot);}
  .grad-blue{background:var(--grad-blue);}
  .grad-lav{background:var(--grad-lav);}
  .sec-pad{padding-block:clamp(4.5rem,8vw,8rem);}
  [data-density="spacious"] .sec-pad{padding-block:clamp(6rem,11vw,11rem);}
  /* marquee */
  .marquee{-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);}
  .mq-row{display:flex;gap:1rem;width:max-content;animation:mqscroll 46s linear infinite;}
  .mq-row.r2{animation-duration:60s;animation-direction:reverse;}
  .mq-row.r3{animation-duration:52s;}
  .marquee:hover .mq-row{animation-play-state:paused;}
  @keyframes mqscroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  .g1{background:radial-gradient(circle at 30% 30%,#ffd1e0,#ff7eb3);}
  .g2{background:radial-gradient(circle at 30% 30%,#ffe0b8,#f2994a);}
  .g3{background:radial-gradient(circle at 30% 30%,#ffc0c0,#e23b3b);}
  .g4{background:radial-gradient(circle at 30% 30%,#c9b6ff,#6c5ce7);}
  .g5{background:radial-gradient(circle at 30% 30%,#bfe0ff,#2f6bff);}
  .g6{background:radial-gradient(circle at 30% 30%,#bff0d8,#1f9d63);}
  .g7{background:radial-gradient(circle at 30% 30%,#ffe9a8,#d9a521);}
  .g8{background:radial-gradient(circle at 30% 30%,#d6c2ff,#8a5cf0);}
  .g9{background:radial-gradient(circle at 30% 30%,#bdeaff,#2bb3d4);}
  .g10{background:radial-gradient(circle at 30% 30%,#ffd0c2,#ff6b4a);}
  .ring-prog{background:conic-gradient(var(--blue) 0 25%, var(--line-2) 0);}
  /* faq native */
  details.faq summary{list-style:none;cursor:pointer;}
  details.faq summary::-webkit-details-marker{display:none;}
  .faq-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.16,1,.3,1);}
  details.faq[open] .faq-body{grid-template-rows:1fr;}
  .faq-body>div{overflow:hidden;}
  @media(prefers-reduced-motion:reduce){.mq-row{animation:none;}html{scroll-behavior:auto;}}
</style>
</head>
<body data-accent="lavender" data-density="regular">
<div id="root"></div>

</body>
</html>
